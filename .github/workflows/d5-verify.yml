# M1-D5 验收：证明「真正删 Release + 删 tag」那两行在线上能跑通。
#
# 为什么要单独一个 workflow：
#   - cleanup_releases.sh 只删「不在最近 3 个 + 不是 latest + 建了 > keep_days 天」的 Release。
#     仓里长期只有 3 个 Release，index >= 3 那一档压根不存在，所以 D5 的删除分支一直零执行。
#   - 等自然满足要到 2026-09-25 左右。
# 做法：造一个**注定被选中**的探针 —— 把 tag 打在 2026-09-06 的 Initial commit 上，
#      Release 的 created_at 取 commit 日期 → 排到最旧 → index 3 且超期 → 正好被删。
#      三个真 Release 是 index 0/1/2，全部豁免；探针还是 prerelease + make_latest=false，latest 不受影响。
name: d5-verify

# 2026-09-17 已验收通过（run 35212215984）。改为**只手动触发**，避免改这个文件时误跑。
# 要复验：Actions → d5-verify → Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API: https://api.github.com/repos/${{ github.repository }}
      PROBE: d5-probe-${{ github.run_id }}
      OLD_COMMIT: 7d4faff5af3cc716b4e0a2e6a2e55fc0190f1416
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 记录删除前的 Release 清单
        run: |
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases?per_page=100" \
            | python -c 'import json,sys;[print(r["tag_name"],r["created_at"]) for r in json.load(sys.stdin)]' \
            | tee before.txt
          echo "latest=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases/latest" \
            | python -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')" | tee latest.txt

      - name: 造探针 Release（打在最旧的 commit 上，prerelease，不动 latest）
        run: |
          python - > payload.json <<PY
          import json, os
          print(json.dumps({
              "tag_name": os.environ["PROBE"],
              "target_commitish": os.environ["OLD_COMMIT"],
              "name": "D5 删除路径验证探针",
              "body": "M1-D5 验收用，创建后立刻由 cleanup_releases.sh 删除。",
              "prerelease": True,
              "make_latest": "false",
          }))
          PY
          cat payload.json
          code=$(curl -sS -o probe.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json'             -H 'Content-Type: application/json'             "$API/releases" --data-binary @payload.json)
          echo "HTTP $code"; cat probe.json
          [ "$code" = "201" ] || { echo "::error::建探针失败"; exit 1; }
          python -c 'import json;d=json.load(open("probe.json"));print("探针 created_at =",d["created_at"])'

      - name: 断言探针确实存在（删之前；Release 列表有最终一致性，带重试）
        run: |
          for i in $(seq 1 15); do
            curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases?per_page=100" > rel.json
            python -c "import json;print(chr(10).join(r['tag_name'] for r in json.load(open('rel.json'))))" > tags.txt
            if grep -qx "$PROBE" tags.txt; then echo "第 $i 次轮询看到探针 ✓"; break; fi
            echo "  第 $i 次还没看到，等 4 秒"; sleep 4
          done
          grep -qx "$PROBE" tags.txt || { echo "::error::探针 Release 始终没出现"; cat tags.txt; exit 1; }
          git ls-remote --tags origin "refs/tags/$PROBE" | grep -q "$PROBE" || { echo "::error::探针 tag 没建上"; exit 1; }
          echo "探针 Release 与 tag 都在 ✓"

      - name: 【被验对象】跑 D5 清理，keep_days=0
        run: bash scripts/cleanup_releases.sh 0 | tee cleanup.txt

      - name: 断言探针已被删、三个真 Release 一个不少、latest 没变
        run: |
          grep -qE "本次处理 [1-9][0-9]* 个" cleanup.txt || { echo "::error::清理一个都没处理"; cat cleanup.txt; exit 1; }
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases?per_page=100" \
            | python -c 'import json,sys;[print(r["tag_name"],r["created_at"]) for r in json.load(sys.stdin)]' > after.txt
          cat after.txt
          grep -q "d5-probe-" after.txt && { echo "::error::还有 d5-probe-* Release 没被删"; exit 1; }
          git fetch --tags --prune --prune-tags origin
          git ls-remote --tags origin | grep -q "refs/tags/d5-probe-" && { echo "::error::还有 d5-probe-* tag 没被删"; exit 1; }
          python - <<'PY'
          before=[l.split()[0] for l in open('before.txt') if l.strip() and not l.startswith('d5-probe-')]
          after=[l.split()[0] for l in open('after.txt') if l.strip()]
          missing=[t for t in before if t not in after]
          assert not missing, '真 Release 被误删：%s' % missing
          print('删除前 %d 个真 Release，删除后全部健在：%s' % (len(before), after))
          PY
          new_latest=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases/latest" \
            | python -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')
          grep -q "latest=$new_latest" latest.txt || { echo "::error::latest 变了"; exit 1; }
          echo "D5 通过：探针 Release + tag 均已真删；真 Release 与 latest=$new_latest 均未受影响"

      - name: 写 Job Summary
        if: always()
        run: |
          { echo "## M1-D5 删除分支线上验证"; echo;
            echo '```'; cat cleanup.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
