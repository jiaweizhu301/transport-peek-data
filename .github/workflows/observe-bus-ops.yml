# M7.5 WP-06 B2（worker-api.md §9.9 stop_ops_miss）：把实时整份公交 TripUpdates 里观测到的
# ADDED / REPLACEMENT trip 的 (站, agency) 并进 observed/bus_stop_agencies.json（滚动文件，35 天窗口）。
# daily.yml 的 gen_manifest 读这份文件，把观测对并进 Release 资产 stop_ops.json —— Worker 不猜。
#
# 只在悉尼白天跑（02:30 的 daily 那时几乎没车）。GitHub cron 会晚点几小时，无所谓：白天任何时刻都行。
# 每次 1 个 TfNSW 请求（整份公交 feed ≈ 2.5 MB，只在内存里，不落盘、不进仓）；key 同 daily.yml。
# 只提交滚动文件，不发 Release（发 Release 只有 daily.yml）。
name: observe-bus-ops

on:
  schedule:
    # UTC 22:00 / 02:00 / 06:00 = 悉尼约 08–09 / 12–13 / 16–17 点（AEST / AEDT）
    - cron: '0 22,2,6 * * *'
  workflow_dispatch:

permissions:
  contents: write        # 提交滚动文件

concurrency:
  group: daily           # 与 daily.yml 同组：不与它的心跳提交抢推
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # 只用标准库，不装依赖
      - name: 自检（解码器 / 滚动文件 / 并入规则）
        run: python scripts/stop_ops.py --selftest

      - name: 拉一次整份公交 feed，并进滚动文件
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: python scripts/stop_ops.py --observe-live observed/bus_stop_agencies.json

      - name: 提交滚动文件
        run: |
          git config user.name  'transport-peek-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add observed/bus_stop_agencies.json
          git commit -m "observe bus stop agencies $(date -u +%FT%TZ)" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
