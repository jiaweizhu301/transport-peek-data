# M4-4.1 · 早高峰原始快照采集
#
# 与 peak-sample.yml 的区别：那个是**制造流量**（去戳我们自己的 Worker，好让 Cloudflare
# 记下 cpuTime）；这个是**采集上游原始 feed**，给 4.1 的 D1 写入行数那本账算样本。
#
# 为什么不放本机：2026-09-22 试过一次，机器 02:18 进 S3 睡眠、10:59 才醒，
# 07:30–09:00 整个睡过去。早高峰一周只有 5 次，不能押在一台会睡觉的机器上。
#
# 只抓不算：解码与签名口径住在主仓（worker/src/decode.js）。复制一份到这里就是两份实现，
# 这个项目已经为「两份 gen_manifest.py」付过学费。这里只产出原始 protobuf artifact，
# 分析在主仓用 worker/scripts/peak-sample-analyse.mjs 离线跑。
name: m4-peak-capture

on:
  schedule:
    # ⚠ **GitHub 的 schedule 不准时**，这三条 cron 的排法就是为了这件事。
    # 2026-09-22 实测：UTC 20:25 / 21:25 那两条分别在 UTC 23:01 / 23:40 才起跑
    # （延迟 2h36m / 2h15m），落到悉尼 09:01 / 09:40，guard 按「小时 = 7」跳过 ——
    # 两个 run 全绿、零 artifact、早高峰整个丢掉。
    #
    # 修法不是把 guard 拓宽（那天连 8 点都没落进），而是**早点起 + 在 runner 里等**：
    # peak-capture.mjs 的 --wait-until 会 sleep 到悉尼 07:25 再开采。
    #   19:25 UTC -> 悉尼 05:25（AEST）/ 06:25（AEDT）
    #   20:25 UTC -> 悉尼 06:25 / 07:25
    #   21:25 UTC -> 悉尼 07:25 / 08:25
    # 三条里任意一条准时或小幅延迟都能覆盖 07:25；今天已采过的由 guard 去重。
    #
    # ⚠ 2026-09-24 又落空：UTC 19:25 / 20:25 / 21:25 三条实际在悉尼 08:21 / 08:59 / 09:49
    # 才起跑，延迟约 3 小时，guard 全部判 peak-skipped。所以再提前两小时，改成 5 条：
    #   17:25 UTC -> 悉尼 03:25（AEST）/ 04:25（AEDT，10-04 起）
    #   18:25 UTC -> 悉尼 04:25 / 05:25
    #   19:25 UTC -> 悉尼 05:25 / 06:25
    #   20:25 UTC -> 悉尼 06:25 / 07:25
    #   21:25 UTC -> 悉尼 07:25 / 08:25
    # 延迟 3 小时时最早那条落在悉尼 06:25 左右，仍能等到 07:25。
    # 星期：悉尼的周一–周五 = UTC 的周日–周四。
    - cron: "25 17 * * 0-4"
    - cron: "25 18 * * 0-4"
    - cron: "25 19 * * 0-4"
    - cron: "25 20 * * 0-4"
    - cron: "25 21 * * 0-4"
  workflow_dispatch:
    inputs:
      windows:
        description: "采多少个窗口（默认 80，× 65 s ≈ 87 分钟）"
        required: false
        default: "80"

concurrency:
  group: m4-peak-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # guard 要用 GITHUB_TOKEN 查本仓的 artifact 列表（去重）。显式给 actions: read ——
    # 仓库默认 token 权限若被调成最小，查询失败会让 guard 红掉（红是可见的，不是静默）。
    permissions:
      actions: read
      contents: read
    # 最坏情况：03:25（AEST）准时起跑，等到 07:25 = 240 分钟，再采 80 × 65 s ≈ 87 分钟，
    # 加 checkout / setup-node / 上传约 5 分钟 ≈ 332 分钟 < 355（GitHub 上限 360）。
    # ⚠ 不够就调大这个数，**不许缩采集窗口** —— 判据要 07:30–09:00 内 >= 10 个连续窗口。
    timeout-minutes: 355
    steps:
      - name: 只在悉尼工作日早高峰之前继续
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          H=$(TZ=Australia/Sydney date +%-H)
          D=$(TZ=Australia/Sydney date +%u)
          TODAY=$(TZ=Australia/Sydney date +%F)
          echo "悉尼 $(TZ=Australia/Sydney date '+%F %H:%M %Z')（周 $D）"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发**不等** —— 否则测一次就把自己卡到明早。
            echo "手动触发：跳过时间窗检查，也不等 07:25"
            echo "go=1" >> "$GITHUB_OUTPUT"
            echo "wait=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$D" -gt 5 ]; then
            echo "reason=悉尼周末（周 $D），4.1 的判据只认工作日早高峰" >> "$GITHUB_OUTPUT"
            echo "go=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 放行悉尼 03:xx–07:xx：起得早的在 runner 里等到 07:25。
          # 08:00 之后才起的已经来不及采 07:30–09:00。
          if [ "$H" -ge 8 ] || [ "$H" -lt 3 ]; then
            echo "reason=起跑时刻是悉尼 ${H}:xx，不在 03–07 点，来不及采 07:30–09:00" >> "$GITHUB_OUTPUT"
            echo "go=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 三条 cron 都会等到 07:25，所以必须去重。用 **artifact 列表**判，不用 run 列表 ——
          # 跳过的 run 也是 success（见下面的 SKIPPED 凭证），拿 run 状态判会误判成「已采过」。
          ARTS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100"                    --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("peak-raw-")) | .created_at')
          for a in $ARTS; do
            AD=$(TZ=Australia/Sydney date -d "$a" +%F)
            if [ "$AD" = "$TODAY" ]; then
              echo "reason=今天（$TODAY）已经有 peak-raw artifact（$a UTC），本次不重复采" >> "$GITHUB_OUTPUT"
              echo "go=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "go=1" >> "$GITHUB_OUTPUT"
          echo "wait=07:25" >> "$GITHUB_OUTPUT"

      # 跳过路径必须留痕。2026-09-22 两个 run 的 conclusion 都是 success 而它们什么都没干，
      # `gh run list` 看到一片绿，没人会发现早高峰丢了 —— **一个「通过」的东西，
      # 它通过的不是你以为的那件事**。有了这个 artifact，「绿但没采到」与「绿且采到了」
      # 在 artifact 列表里一眼可分。
      - name: 记下这次为什么没采
        if: steps.guard.outputs.go != '1'
        run: |
          {
            echo "SKIPPED"
            echo "悉尼时间：$(TZ=Australia/Sydney date '+%F %H:%M:%S %Z')"
            echo "UTC：$(date -u '+%F %H:%M:%S')"
            echo "原因：${{ steps.guard.outputs.reason }}"
            echo "run：${{ github.run_id }}（${{ github.event_name }}）"
          } | tee SKIPPED.txt

      - name: 上传跳过凭证
        if: steps.guard.outputs.go != '1'
        uses: actions/upload-artifact@v4
        with:
          name: peak-skipped-${{ github.run_id }}
          path: SKIPPED.txt
          retention-days: 14

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == '1'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == '1'
        with:
          node-version: "20"

      - name: 采集原始快照
        if: steps.guard.outputs.go == '1'
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: |
          node scripts/peak-capture.mjs \
            --out peak-raw \
            --windows "${{ github.event.inputs.windows || '80' }}" \
            ${{ steps.guard.outputs.wait && format('--wait-until {0}', steps.guard.outputs.wait) || '' }}
          du -sh peak-raw
          ls peak-raw | wc -l

      - name: 上传 artifact
        if: steps.guard.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: peak-raw-${{ github.run_id }}
          path: peak-raw/
          retention-days: 14

      - name: 摘要
        if: steps.guard.outputs.go == '1'
        run: |
          {
            echo "## M4-4.1 早高峰快照采集完成"
            echo ""
            echo "- 悉尼时间：$(TZ=Australia/Sydney date '+%F %H:%M %Z')"
            echo "- artifact：\`peak-raw-${{ github.run_id }}\`（保留 14 天）"
            echo ""
            echo "分析在主仓跑，**不要在这里加解码逻辑**："
            echo '```'
            echo "node worker/scripts/peak-sample-analyse.mjs --in <解开的 peak-raw> --json out.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
