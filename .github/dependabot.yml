# SEC-04：Actions 钉 SHA + pip 钉 hash 之后，靠 Dependabot 每月提 PR 升级（不自动合并）。
# 注意：每合并一个 Dependabot PR，下一次 daily cron 就照常发一版 latest。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
